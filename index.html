<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storefront</title>
    <style>
      :root{
        --bg: #f6f8fb;
        --card-bg: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb; /* blue-600 */
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      header {
        background: linear-gradient(180deg, #fff, #f9fafb);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem 1.25rem;
      }
      .brand {
        display: flex; align-items: baseline; gap: .75rem;
      }
      .brand h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: .2px;
      }
      .brand .tagline { color: var(--muted); font-size: .95rem; }

      main .container { padding-top: 1.25rem; }

      /* Grid of product cards */
      #list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        align-items: stretch;
      }

      /* Card */
      .product {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(16,24,40,0.04);
        padding: 1rem;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto auto;
        gap: .5rem .75rem;
        transition: transform .12s ease, box-shadow .12s ease;
      }
      .product:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(16,24,40,0.08); }
      .name { grid-column: 1 / -1; font-weight: 600; }
      .price { grid-column: 1 / -1; color: var(--primary-700); font-weight: 600; font-size: 1.05rem; }

      .qty {
        width: 4rem;
        grid-column: 1 / 2;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: .4rem .5rem;
        font: inherit;
      }
      button {
        grid-column: 2 / 3;
        padding: .5rem .8rem;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid transparent;
        color: #fff;
        background: var(--primary);
        font-weight: 600;
      }
      button:hover { background: var(--primary-700); }
      button:focus { outline: 2px solid #93c5fd; outline-offset: 2px; }

      .empty, .error { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div class="container brand">
        <h1>Storefront</h1>
        <div class="tagline">Fresh picks, fair prices</div>
      </div>
    </header>

    <main>
      <div class="container">
        <div id="list">Loading…</div>
      </div>
    </main>

    <script>
      function centsToUSD(cents){
        return (cents/100).toLocaleString(undefined,{style:'currency',currency:'USD'});
      }

      async function load(){
        const res = await fetch('/api/products');
        if(!res.ok){ document.getElementById('list').textContent = 'Failed to load products'; return; }
        const products = await res.json();
        const root = document.getElementById('list');
        root.innerHTML = '';

        products.forEach(p => {
          const row = document.createElement('div');
          row.className = 'product';

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = p.name + ' (stock: ' + p.stock + ')';

          const price = document.createElement('div');
          price.className = 'price';
          price.textContent = centsToUSD(p.price_cents);

          const qty = document.createElement('input');
          qty.type = 'number';
          qty.min = '1';
          qty.value = '1';
          qty.className = 'qty';

          const buy = document.createElement('button');
          buy.textContent = 'Buy';
          buy.onclick = async () => {
            const quantity = parseInt(qty.value, 10) || 1;
            try{
              const r = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: p.id, quantity })
              });
              const data = await r.json();
              if(!r.ok){
                alert('Error: ' + (data && data.error ? data.error : r.status));
                return;
              }
              alert('Order placed! Total: ' + centsToUSD(data.total_cents));
              // refresh stock display
              load();
            }catch(err){
              alert('Network error');
            }
          };

          row.appendChild(name);
          row.appendChild(price);
          row.appendChild(qty);
          row.appendChild(buy);
          root.appendChild(row);
        });
      }

      load();
    </script>
  </body>
  </html>
